name: docker

# Builds the GPU images and pushes them to ghcr.io/nnfc-gmd/chrombpnet:
#   <version>-cuda13, latest-cuda13, <sha>-cuda13   (driver >= 580: H100, B200, RTX PRO 6000 Blackwell)
#   <version>-cuda12, latest-cuda12, <sha>-cuda12   (older drivers)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "cuda13 image platforms (linux/arm64 is built under QEMU and takes hours)"
        default: linux/amd64
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'NNFC-GMD/chrombpnet'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pixi_env: cuda13, cuda: "13.0", platforms: "${{ inputs.platforms || 'linux/amd64' }}" }
          - { pixi_env: cuda12, cuda: "12.0", platforms: linux/amd64 }
    steps:
      # The CUDA environments are ~5 GB and exist twice during the build (build stage + runtime stage).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/nnfc-gmd/chrombpnet
          flavor: |
            latest=false
            suffix=-${{ matrix.pixi_env }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platforms }}
          build-args: |
            PIXI_ENV=${{ matrix.pixi_env }}
            CUDA_VERSION=${{ matrix.cuda }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache: the GitHub Actions cache (10 GB per repository) is too small for these layers.
          cache-from: type=registry,ref=ghcr.io/nnfc-gmd/chrombpnet:buildcache-${{ matrix.pixi_env }}
          cache-to: type=registry,ref=ghcr.io/nnfc-gmd/chrombpnet:buildcache-${{ matrix.pixi_env }},mode=max
